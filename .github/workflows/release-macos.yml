name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.3.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release macOS DMG
    runs-on: macos-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate tag and set application version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "The ${RELEASE_TAG} tag already exists."
            exit 1
          fi

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${release_version}"
            exit 1
          fi

          sed -i.bak -E "s/^(version = ).*/\1\"${release_version}\"/" src-tauri/Cargo.toml
          sed -i.bak -E "s/\"version\": \"[^\"]+\"/\"version\": \"${release_version}\"/" package.json
          sed -i.bak -E "s/\"version\": \"[^\"]+\"/\"version\": \"${release_version}\"/" src-tauri/tauri.conf.json
          rm -f src-tauri/Cargo.toml.bak package.json.bak src-tauri/tauri.conf.json.bak

          echo "Building Klipo ${release_version}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the Tauri app
        run: bun run tauri build

      - name: Create tag, GitHub release, and upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)

          if (( ${#dmg_files[@]} == 0 )); then
            echo "No macOS DMG was produced."
            exit 1
          fi

          release_commit="$(git rev-parse HEAD)"

          gh release create "$RELEASE_TAG" "${dmg_files[@]}" \
            --target "$release_commit" \
            --title "$RELEASE_TAG" \
            --notes "## macOS installation notice

          The attached DMG is unsigned and not notarized. Download it only from this official GitHub release. See the README for Gatekeeper installation guidance." \
            --generate-notes
